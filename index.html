<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description"
        content="Thala 7 Sneaker Store - Premium collection of sneakers for men and women. Shop the latest trends in footwear with fast delivery and easy returns.">
    <title>Thala 7 Sneaker Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h1>Thalla <span class="tagline">7.</span></h1>
                </div>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#brands">Brands <span class="down-arrow"> > </span></a></li>
                    <li><a href="#more">More <span class="down-arrow"> > </span></a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <div class="header-icons">
                    <div class="form-group">
                        <input type="search" name="search" id="search" placeholder="Search">
                    </div>
                    <div class="cart">
                        <span><i class="fa-solid fa-bag-shopping"></i> &nbsp; 0 </span>
                    </div>
                    <div class="profile-pic" alt="Profile"></div>
                </div>
            </nav>
        </div>
    </header>
    <!-- Header and Navigation -->

    <main>
        <!-- Hero Section -->
        <section class="hero" id="home">
            <div class="hero-content">
                <h1>7!! Thala For a <span class="text-primary">Reason!</span></h1>
                <p>Thala 7 Sneaker Store - Premium collection of sneakers for men and women. Shop the latest trends in
                    footwear with fast delivery and easy returns.</p>
                <div class="hero-buttons">
                    <a href="#" class="btn btn-dark border25">Shop Now</a>
                </div>
            </div>
            <div class="hero-image">
                <img src="https://png.pngtree.com/png-vector/20230501/ourmid/pngtree-sneakers-running-shoes-bright-colors-png-image_7078169.png"
                    alt="Thala 7 Sneaker">
            </div>
        </section>
    </main>
</body>

</html>
